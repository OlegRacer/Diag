<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarPlay Web Remote</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { font-size: 18px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 20px; }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            background: #333;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #555;
        }
        button.play-btn {
            background: #1db954;
            width: 65px;
            height: 65px;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>CarPlay Пульт</h2>
        <p>Керування Flacbox</p>
        
        <div class="controls">
            <button id="prev">⏮</button>
            <button id="playPause" class="play-btn">▶</button>
            <button id="next">⏭</button>
        </div>
    </div>

    <script>
        // Необхідний елемент аудіо для активації медіаконтексту в iOS
        const dummyAudio = new Audio();
        // Коротка тиша в форматі data URI, щоб iOS дозволила запустити аудіосесію
        dummyAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
        
        let isPlaying = false;
        const playPauseBtn = document.getElementById('playPause');

        // Ініціалізація Media Session API
        if ('mediaSession' in navigator) {
            
            // Оновлюємо метадані (можна змінити на реальні, якщо читаєте їх)
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Flacbox Трек',
                artist: 'Автомобільний режим',
                album: 'Web Remote'
            });

            // Дії при натисканні кнопок у системі або на вашому пульті
            navigator.mediaSession.setActionHandler('play', function() {
                dummyAudio.play().catch(e => console.log(e));
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            });

            navigator.mediaSession.setActionHandler('pause', function() {
                dummyAudio.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            });

            navigator.mediaSession.setActionHandler('previoustrack', function() {
                console.log('Попередній трек');
                // Тут можна додати візуальний відгук
            });

            navigator.mediaSession.setActionHandler('nexttrack', function() {
                console.log('Наступний трек');
            });
        }

        // Обробники кліків на кнопки на вашій вебсторінці
        playPauseBtn.addEventListener('click', async () => {
            if (!isPlaying) {
                try {
                    await dummyAudio.play();
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.playbackState = 'playing';
                    }
                } catch (err) {
                    console.log("Помилка активації аудіо:", err);
                }
            } else {
                dummyAudio.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'paused';
                }
            }
        });

        document.getElementById('prev').addEventListener('click', () => {
            if ('mediaSession' in navigator && navigator.mediaSession.setActionHandler) {
                // Штучно викликаємо дію попереднього треку
                try { navigator.mediaSession.setActionHandler('previoustrack')(); } catch(e){}
            }
        });

        document.getElementById('next').addEventListener('click', () => {
            if ('mediaSession' in navigator && navigator.mediaSession.setActionHandler) {
                try { navigator.mediaSession.setActionHandler('nexttrack')(); } catch(e){}
            }
        });
    </script>
</body>
</html>
