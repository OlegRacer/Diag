<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarPlay Shortcuts Remote</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { font-size: 18px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 20px; }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            background: #333;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #555;
        }
        button.play-btn {
            background: #1db954;
            width: 65px;
            height: 65px;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>CarPlay Пульт</h2>
        <p>Через додаток «Команди»</p>
        
        <div class="controls">
            <button id="prev">⏮</button>
            <button id="playPause" class="play-btn">⏯</button>
            <button id="next">⏭</button>
        </div>
    </div>

    <script>
        // Функція для запуску системної команди iOS
        function runShortcut(shortcutName) {
            const url = `shortcuts://run-shortcut?name=${encodeURIComponent(shortcutName)}`;
            window.location.href = url;
        }

        document.getElementById('playPause').addEventListener('click', () => {
            // Назва вашої команди в додатку "Команди" для паузи/плеєра
            runShortcut('FlacboxPlay');
        });

        document.getElementById('next').addEventListener('click', () => {
            // Назва вашої команди для наступного треку
            runShortcut('FlacboxNext');
        });

        document.getElementById('prev').addEventListener('click', () => {
            // За бажанням створіть команду FlacboxPrev і додайте сюди
            // runShortcut('FlacboxPrev');
        });
    </script>
</body>
</html>
